</style></head><body><div class="shell"><header class="hero"><h1>英文穴埋め 単語帳</h1><p>全10問｜問題番号・検索・解説切り替え｜GitHub Pages対応</p></header><div class="layout"><aside class="panel"><label for="search"><strong>問題を検索</strong></label><input id="search" placeholder="英単語・問題番号で検索"><div class="list" id="list"></div></aside><main class="content"><div class="head"><div><div class="count" id="count"></div><h2 id="title"></h2></div></div><div class="tabs" id="tabs"></div><div class="actions"><button id="copy">この問題の解説全文をコピー</button><button id="showSource">原文表示</button></div><article class="section" id="body"></article><p class="note">原文はアップロードされた会話記録から保存しています。画面表示では一部のチャット専用UIをテキスト表示に変換しています。</p></main></div></div><script id="card-data" type="application/json">[{"n": 1, "title": "The repairs to the production line ------- delays in filling several important orders.", "raw": "## ① The repairs to the production line ------- delays in filling several important orders.\n\n**正解：caused（引き起こした）**\n\n完成した英文：\n\n> The repairs to the production line **caused** delays in filling several important orders.\n\n**和訳：** 生産ラインの修理によって、いくつかの重要な注文への対応に遅れが生じました。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、この問題で大切なのは、何が原因で、何が結果なのかを見抜くことです。」\n\n- **The repairs**：修理（原因）\n- **to the production line**：生産ラインの\n- **caused**：引き起こした\n- **delays**：遅延（結果）\n- **in filling several important orders**：いくつかの重要な注文に対応する際の\n\n「つまり、修理が原因で注文への対応が遅れた、ということですね。」\n\n## B【詳しい解説｜文法と語順】\n\n「では先輩、英文を3つに分けてみましょう。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} align=\"center\" gap={1}>\n    <text color=\"secondary\" size=\"xs\">主語 S<\/text>\n    **The repairs to the production line**\n    <text size=\"xs\">生産ラインの修理<\/text>\n  <\/box>\n  <box align=\"center\" gap=0>\n    <icon name=\"arrow-down\" color=\"secondary\" size=\"lg\"/>\n  <\/box>\n  <box background=\"rgba(20,125,95,0.09)\" radius=\"md\" padding={3} align=\"center\" gap={1}>\n    <text color=\"success\" size=\"xs\">動詞 V<\/text>\n    **caused**\n    <text size=\"xs\">引き起こした<\/text>\n  <\/box>\n  <box align=\"center\" gap=0>\n    <icon name=\"arrow-down\" color=\"secondary\" size=\"lg\"/>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} align=\"center\" gap={1}>\n    <text color=\"secondary\" size=\"xs\">目的語 O<\/text>\n    **delays in filling several important orders**\n    <text size=\"xs\">重要な注文への対応の遅れ<\/text>\n  <\/box>\n<\/box>\n\n「ここで注意してほしいのが **in filling** です。」\n\n*in* は前置詞なので、後ろの動詞 *fill* は動名詞の *filling* になります。\n\nまた、*fill an order* は「注文に応じる・注文された商品を用意する」という意味です。\n\n## C【イメージ理解｜具体的に想像しましょう】\n\n「先輩が工場の責任者だったとします。」\n\n生産ラインの機械が故障して、修理のために3時間停止しました。\n\nその間、商品を製造できません。\n\nすると、予定していた注文への対応が遅れてしまいますよね。\n\n修理による停止 → 生産の遅れ → 注文対応の遅延\n\n「はい。この原因と結果を結びつけるのが **cause** なんです。」\n\n## D【類義語｜ニュアンスの違い】\n\n| 単語 | 核となるイメージ | 例文 |\n|---|---|---|\n| **cause** | 直接的に引き起こす | The error caused delays. |\n| **lead to** | ある結果につながる | The repairs led to delays. |\n| **result in** | 結果として〜になる | The repairs resulted in delays. |\n| **bring about** | 変化や状況をもたらす | The changes brought about improvements. |\n\n「特にTOEICでは、**cause / lead to / result in** の違いを押さえておきましょう。」\n\n## 理解確認\n\n{@body const [answer,setAnswer] = DIL.useState(\"b\")}\n{@body const [checked,setChecked] = DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  **Q. The machine breakdown ------- a delay in production.**\n\n  <radio-group direction=\"col\" value={answer} onChange={v=>{setAnswer(v);setChecked(false)}}>\n    <radio value=\"a\">A. causing<\/radio>\n    <radio value=\"b\">B. caused<\/radio>\n    <radio value=\"c\">C. cause<\/radio>\n    <radio value=\"d\">D. to cause<\/radio>\n  <\/radio-group>\n  <button block onClick={()=>setChecked(true)}>答え合わせ<\/button>\n  {#if checked}\n    <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n      <text color={answer===\"b\"?\"success\":\"default\"} weight=\"medium\">{answer===\"b\"?\"正解です！\":\"正解は B. caused です。\"}<\/text>\n      過去に起きた故障が生産の遅延を引き起こしたという文です。主語の後ろには述語動詞が必要なので、過去形の *caused* が適切です。\n    <\/box>\n  {/if}\n<\/box>\n\n**30秒復習**\n\n- cause + 名詞：〜を引き起こす\n- cause delays：遅延を引き起こす\n- fill an order：注文に応じる\n- delays in doing：〜する際の遅延\n\n「先輩、最後に一つ。今回の空欄は選択肢が提示されていないので、*caused* は自然な解答例です。選択肢があれば、時制も含めて正解を確定できますよ。」"}, {"n": 2, "title": "The Effective Manager by Charles Turay covers several ------- techniques for improving staff productivity.", "raw": "## ② The Effective Manager by Charles Turay covers several ------- techniques for improving staff productivity.\n\n**正解例：effective（効果的な）**\n\n完成した英文：\n\n> The Effective Manager by Charles Turay covers several **effective** techniques for improving staff productivity.\n\n**和訳：** チャールズ・トゥレイ著『The Effective Manager』では、従業員の生産性を向上させるための、いくつかの効果的な手法が紹介されています。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、今回のポイントは **空欄の後ろに techniques という名詞があること**です。」\n\n- **several**：いくつかの\n- **effective**：効果的な（形容詞）\n- **techniques**：手法、技術（名詞）\n\n「つまり、*effective* が *techniques* を説明しているんです。」\n\n## B【詳しい解説｜文法と語順】\n\n「では、英文を意味のまとまりごとに区切りますよ。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">主語 S<\/text>\n    **The Effective Manager by Charles Turay**\n    <text size=\"sm\">チャールズ・トゥレイ著『The Effective Manager』<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">動詞 V<\/text>\n    **covers**\n    <text size=\"sm\">取り上げている、扱っている<\/text>\n  <\/box>\n  <box background=\"rgba(20,125,95,0.09)\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"success\" size=\"xs\">目的語 O<\/text>\n    **several effective techniques**\n    <text size=\"sm\">いくつかの効果的な手法<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">目的を表す部分<\/text>\n    **for improving staff productivity**\n    <text size=\"sm\">従業員の生産性を向上させるための<\/text>\n  <\/box>\n<\/box>\n\n「先輩、ここで *effective* と *effectively* を混同しないでくださいね。」\n\n- effective（形容詞）：効果的な手法\n- effectively（副詞）：効果的に実行する\n- effectiveness（名詞）：有効性、効果の程度\n- effect（名詞）：効果、影響\n\n「*techniques* は名詞なので、その前には形容詞の *effective* が自然です。」\n\nただし、選択肢がないため、*practical*（実用的な）や *innovative*（革新的な）なども文法的には入ります。\n\n## C【イメージ理解｜身近な場面で考えましょう】\n\n「先輩が会社の管理職になったと想像してください。」\n\n従業員の作業効率を上げたいと考えています。\n\nそこで、仕事の優先順位を決めたり、作業手順を改善したりする方法を学びます。\n\nこうした方法が実際に生産性向上に役立つなら、**effective techniques** と呼べるんです。\n\n## D【類義語｜ニュアンスの違い】\n\n| 単語 | イメージ | 例文 |\n|---|---|---|\n| **effective** | 目的に対して効果がある | This method is effective. |\n| **efficient** | 時間や労力の無駄が少ない | This system is efficient. |\n| **practical** | 実際に使いやすい | This is a practical solution. |\n| **productive** | 多くの成果を生み出す | We had a productive meeting. |\n\n「特に **effective と efficient** はTOEICでも重要です。」\n\neffective は「目的を達成できるか」、efficient は「無駄なく達成できるか」に注目しています。\n\n## 理解確認\n\n{@body const [answer,setAnswer] = DIL.useState(\"a\")}\n{@body const [checked,setChecked] = DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  **Q. The company introduced a new system to improve operational -------.**\n\n  <radio-group direction=\"col\" value={answer} onChange={v=>{setAnswer(v);setChecked(false)}}>\n    <radio value=\"a\">A. efficient<\/radio>\n    <radio value=\"b\">B. efficiently<\/radio>\n    <radio value=\"c\">C. efficiency<\/radio>\n    <radio value=\"d\">D. efficiencies<\/radio>\n  <\/radio-group>\n  <button block onClick={()=>setChecked(true)}>答え合わせ<\/button>\n  {#if checked}\n    <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n      <text color={answer===\"c\"?\"success\":\"default\"} weight=\"medium\">{answer===\"c\"?\"正解です！\":\"正解は C. efficiency です。\"}<\/text>\n      *operational* は形容詞なので、後ろには名詞が必要です。*operational efficiency* で「業務効率」という意味になります。\n    <\/box>\n  {/if}\n<\/box>\n\n**30秒復習**\n\n- cover：本などが話題を扱う\n- technique：手法\n- productivity：生産性\n- effective：効果的な\n- efficient：効率的な\n- for + 動名詞：〜するための\n\n**一文で覚える：** Effective techniques improve productivity.（効果的な手法は生産性を向上させる。）\n\n「はい、先輩。今回は *several + 形容詞 + 複数名詞* という形をしっかり覚えてくださいね。選択肢があれば、意味まで含めて正解を絞り込めますから。」"}, {"n": 3, "title": "Though Montreal is known for its inclement winters, the weather is ------- in the summer.", "raw": "## ③ Though Montreal is known for its inclement winters, the weather is ------- in the summer.\n\n**正解例：pleasant（快適な、心地よい）**\n\n<text color=\"secondary\" size=\"sm\">発音：/ˈplez.ənt/（プレザント）<\/text>\n\n完成した英文：\n\n> Though Montreal is known for its inclement winters, the weather is **pleasant** in the summer.\n\n**和訳：** モントリオールは冬の厳しい天候で知られていますが、夏の天候は快適です。\n\n※選択肢がないため、*pleasant* は文脈に合う自然な解答例です。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、今回のポイントは **Though（〜だけれども）** ですよ。」\n\n「この単語があると、前半と後半で対照的な内容が述べられることが多いんです。」\n\n- **Though**：〜だけれども\n- **be known for**：〜で知られている\n- **inclement**：天候が厳しい、荒れ模様の\n- **winters**：冬（複数形）\n- **pleasant**：快適な、心地よい\n\n「つまり、冬は厳しいけれど、夏は快適だという対比ですね。」\n\n## B【詳しい解説｜文法と語順】\n\n「では先輩、英文を前半と後半に分けて考えましょう。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" weight=\"medium\" size=\"xs\">譲歩を表す節<\/text>\n    **Though Montreal is known for its inclement winters,**\n\n    モントリオールは厳しい冬の天候で知られているけれども\n  <\/box>\n  <box align=\"center\" gap={1}>\n    <icon name=\"arrow-down\" color=\"secondary\" size=\"lg\"/>\n    <text color=\"secondary\" size=\"xs\">対照的な内容へ<\/text>\n  <\/box>\n  <box background=\"rgba(20,125,95,0.09)\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"success\" weight=\"medium\" size=\"xs\">主節<\/text>\n    **the weather is pleasant in the summer.**\n\n    夏の天候は快適です\n  <\/box>\n<\/box>\n\n「ここでもう一つ。*is* の後ろには何が入ると思います？」\n\n……\n\n「はい。今回のように天候の状態を説明する場合は、形容詞が入ります。」\n\n**the weather（主語）+ is（動詞）+ pleasant（補語）**\n\nこれは第2文型の **SVC** ですね。\n\nちなみに、*pleasantly* は副詞なので、この空欄には通常入りません。\n\n## C【イメージ理解｜一回、想像してみてください】\n\n「先輩、冬のモントリオールを想像してください。」\n\n<grid columns={2} gap={3}>\n  <grid-item>\n    <AsyncImage query=\"Montreal Canada snowy winter street snowstorm\" aspectRatio=\"4:3\" width=\"100%\"/>\n    <text weight=\"medium\" size=\"sm\">Winter — inclement<\/text>\n    <text color=\"secondary\" size=\"xs\">寒さや雪などで厳しい天候<\/text>\n  <\/grid-item>\n  <grid-item>\n    <AsyncImage query=\"Montreal summer sunny green park city beautiful weather\" aspectRatio=\"4:3\" width=\"100%\"/>\n    <text weight=\"medium\" size=\"sm\">Summer — pleasant<\/text>\n    <text color=\"secondary\" size=\"xs\">暖かく、過ごしやすい天候<\/text>\n  <\/grid-item>\n<\/grid>\n\n「冬は寒さや雪で外出が大変でも、夏になると公園で散歩したり、屋外で食事を楽しんだりできる日が増えます。」\n\n「この対照的なイメージがあれば、*Though* の後に続く内容を予測しやすくなりますよ。」\n\n## D【類義語｜ニュアンスの違い】\n\n「先輩、*pleasant* に似た単語も整理しておきましょう。」\n\n| 単語 | 核となるイメージ | 例文 |\n|---|---|---|\n| **pleasant** | 気持ちよく快適 | It's a pleasant day. |\n| **mild** | 暑さ・寒さが穏やか | The weather is mild. |\n| **comfortable** | 不快感がなく快適 | The temperature is comfortable. |\n| **agreeable** | 心地よく好ましい | The climate is agreeable. |\n| **favorable** | 目的にとって好都合 | The conditions are favorable. |\n\n「特に *pleasant* と *mild* の違いは覚えてください。」\n\n**pleasant** は「心地よい」という感覚全体を表します。一方、**mild** は気温や気候が「極端ではなく穏やか」という意味なんです。\n\n## 理解確認\n\n{@body const [answer,setAnswer] = DIL.useState(\"a\")}\n{@body const [checked,setChecked] = DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  **Q. Although the region experiences harsh winters, temperatures are generally ------- in spring.**\n\n  <radio-group direction=\"col\" value={answer} onChange={v=>{setAnswer(v);setChecked(false)}}>\n    <radio value=\"a\">A. mildly<\/radio>\n    <radio value=\"b\">B. mild<\/radio>\n    <radio value=\"c\">C. mildness<\/radio>\n    <radio value=\"d\">D. milderly<\/radio>\n  <\/radio-group>\n  <button block onClick={()=>setChecked(true)}>答え合わせ<\/button>\n  {#if checked}\n    <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n      <text color={answer===\"b\"?\"success\":\"default\"} weight=\"medium\">{answer===\"b\"?\"正解です！\":\"正解は B. mild です。\"}<\/text>\n      *are* の後ろで気温の状態を説明する形容詞が必要です。*mild* は「穏やかな」という意味で、春の気温を自然に表せます。\n    <\/box>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n- Though：〜だけれども（逆接）\n- be known for：〜で知られている\n- inclement weather：荒れた天候\n- pleasant weather：快適な天候\n- mild weather：穏やかな天候\n- be動詞 + 形容詞：主語の状態を説明する\n\n**一文で覚える：**\n\n*Though the winter is harsh, the summer is pleasant.*\n\n（冬は厳しいけれど、夏は快適です。）\n\n「先輩、今回は **Though による対比**と、**be動詞の後ろに置く形容詞**。この2つをセットで覚えてくださいね。次に似た問題が出ても、文の構造から判断できるようになりますから。」"}, {"n": 4, "title": "Anyone who would like to ------- on the proposals outlined at the meeting is asked to do so at the end of the session.", "raw": "## ④ Anyone who would like to ------- on the proposals outlined at the meeting is asked to do so at the end of the session.\n\n**正解：comment（意見を述べる、コメントする）**\n\n<text color=\"secondary\" size=\"sm\">発音：/ˈkɑː.ment/（カーメント）※アメリカ英語<\/text>\n\n> Anyone who would like to **comment** on the proposals outlined at the meeting is asked to do so at the end of the session.\n\n**和訳：** 会議で概要が説明された提案について意見を述べたい方は、会議の最後に発言するよう求められています。\n\n※選択肢がないため、*comment* は文法と文脈に合う自然な解答例です。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、今回は **comment on ～（〜について意見を述べる）** という表現が重要です。」\n\n「でも、単語だけ覚えて終わりにしないでくださいね。文の構造にも注目しましょう。」\n\n- **Anyone who ～**：〜する人は誰でも\n- **would like to ～**：〜したい\n- **comment on ～**：〜について意見を述べる\n- **proposal**：提案\n- **outlined**：概要が説明された\n- **be asked to ～**：〜するよう求められる\n- **do so**：そうする（前述の行動を指す）\n- **at the end of ～**：〜の最後に\n\n「この文章は、提案に意見を述べたい人に、発言するタイミングを伝えているんです。」\n\n## B【詳しい解説｜文法と語順】\n\n「では先輩、少し長い英文ですが、4つに分けて理解していきましょう。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">① 主語と関係代名詞節<\/text>\n    **Anyone who would like to comment**\n    <text size=\"sm\">意見を述べたい人は誰でも<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">② 意見の対象<\/text>\n    **on the proposals outlined at the meeting**\n    <text size=\"sm\">会議で概要が説明された提案について<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">③ 主節の動詞<\/text>\n    **is asked to do so**\n    <text size=\"sm\">そうするよう求められています<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">④ 時間<\/text>\n    **at the end of the session**\n    <text size=\"sm\">会議の最後に<\/text>\n  <\/box>\n<\/box>\n\n「ここで、3つの文法ポイントを確認します。」\n\n**① would like to + 動詞の原形**\n\n「*to* の後ろには動詞の原形が来ます。だから *commenting* ではなく *comment* ですね。」\n\n**② proposals outlined at the meeting**\n\n「先輩、*outlined* は何を説明していると思います？」\n\n……\n\n「そうです。*proposals* です。*proposals that were outlined at the meeting* と言い換えられます。」\n\n**③ do so**\n\n「これは直前の動作を繰り返さないための表現です。」\n\n*do so* = *comment on the proposals*\n\n「つまり、『そうする』とは『提案について意見を述べる』ということなんです。」\n\n## C【イメージ理解｜会議を想像してください】\n\n「先輩が会社の会議に参加しているとしましょう。」\n\n上司が新しい業務改善案を説明しています。\n\nその後、司会者がこう言います。\n\n> Anyone who would like to comment on the proposals is asked to do so at the end of the session.\n\n「先輩、これは『今すぐ自由に発言してください』という意味でしょうか？」\n\n……\n\n「違いますよね。意見は歓迎していますが、発言するのは会議の最後です。」\n\n「このように *comment on* は、提案や計画、報告書などについて意見を述べる場面で使われます。」\n\n## D【類義語｜ニュアンスの違い】\n\n| 単語 | 核となるイメージ | 例文 |\n|---|---|---|\n| **comment on** | 対象について意見を述べる | She commented on the proposal. |\n| **discuss** | 複数人で話し合う | We discussed the proposal. |\n| **remark on** | 気づいたことを述べる | He remarked on the changes. |\n| **give feedback on** | 改善につながる評価や意見を伝える | Please give feedback on the plan. |\n| **express an opinion on** | 自分の考えを表明する | She expressed an opinion on the issue. |\n\n「先輩、特に *comment on* と *discuss* の違いには注意してください。」\n\n- **comment on the proposal**：提案について意見を述べる\n- **discuss the proposal**：提案について話し合う\n\n「*discuss* は通常、直接目的語を取るので、*discuss about the proposal* とはしません。」\n\n## 理解確認\n\n{@body const [answer,setAnswer] = DIL.useState(\"a\")}\n{@body const [checked,setChecked] = DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  **Q. Employees are encouraged to ------- on the new company policy.**\n\n  <radio-group direction=\"col\" value={answer} onChange={v=>{setAnswer(v);setChecked(false)}}>\n    <radio value=\"a\">A. comment<\/radio>\n    <radio value=\"b\">B. commenting<\/radio>\n    <radio value=\"c\">C. commented<\/radio>\n    <radio value=\"d\">D. commentary<\/radio>\n  <\/radio-group>\n  <button block onClick={()=>setChecked(true)}>答え合わせ<\/button>\n  {#if checked}\n    <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n      <text color={answer===\"a\"?\"success\":\"default\"} weight=\"medium\">{answer===\"a\"?\"正解です！\":\"正解は A. comment です。\"}<\/text>\n      *be encouraged to + 動詞の原形* という構造なので、*comment* が入ります。また、*comment on ～* で「〜について意見を述べる」という意味になります。\n    <\/box>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n- comment on：〜について意見を述べる\n- would like to + 動詞の原形：〜したい\n- outlined：概要が説明された\n- be asked to：〜するよう求められる\n- do so：前に述べた行動をする\n- at the end of：〜の最後に\n\n**一文で覚える：**\n\n*Please comment on the proposal at the end of the meeting.*\n\n（会議の最後に、その提案について意見を述べてください。）\n\n「先輩、今回は *comment on* だけでなく、*do so* が何を指しているかまで理解できれば十分です。長文を読むときにも役立つ表現ですから、セットで覚えておきましょうね。」"}, {"n": 5, "title": "The chair of the project committee has ------- to inform the staff members of when the next meeting will take place.", "raw": "## ⑤ The chair of the project committee has ------- to inform the staff members of when the next meeting will take place.\n\n**正解例：agreed（同意した、承諾した）**\n\n<text color=\"secondary\" size=\"sm\">発音：/əˈɡriːd/（アグリード）<\/text>\n\n> The chair of the project committee has **agreed** to inform the staff members of when the next meeting will take place.\n\n**和訳：** プロジェクト委員会の委員長は、次回の会議がいつ開催されるかをスタッフに知らせることに同意しました。\n\n※選択肢がないため、*agreed* は自然な解答例です。*promised*（約束した）や *decided*（決めた）なども文法的には可能です。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、今回の英文は少し長いですが、重要なのは **has agreed to ～** と **inform A of B** の2つです。」\n\n「ただし、今回は単語の意味だけでなく、コアイメージまで理解していきますよ。」\n\n**英文の重要単語・表現**\n\n<box gap={3}>\n  <row align=\"start\" gap={3}>\n    <box flex=\"1\" gap={1}>\n      **chair**（チェア）\n\n      <text color=\"secondary\" size=\"xs\">/tʃer/<\/text>\n\n      **意味：** 議長、委員長、椅子\n\n      **コアイメージ：** 会議の中心となる席。そこに座って会議を取り仕切る人まで表す。\n\n      「先輩、*chair* は椅子という意味で有名ですが、会議を仕切る人という意味もあるんです。」\n    <\/box>\n  <\/row>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **committee**（コミティー）\n\n    <text color=\"secondary\" size=\"xs\">/kəˈmɪti/<\/text>\n\n    **意味：** 委員会\n\n    **コアイメージ：** 特定の目的や課題について話し合い、判断するために集められた人たち。\n\n    「会社のプロジェクト委員会など、役割を持った集団をイメージしてください。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **agree**（アグリー）\n\n    <text color=\"secondary\" size=\"xs\">/əˈɡriː/<\/text>\n\n    **意味：** 同意する、承諾する\n\n    **コアイメージ：** 自分と相手の考えや意思が一致する。\n\n    「相手から『これをお願いできますか？』と言われて、『はい、引き受けます』と意思が一致する感覚です。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **inform**（インフォーム）\n\n    <text color=\"secondary\" size=\"xs\">/ɪnˈfɔːrm/<\/text>\n\n    **意味：** 知らせる、通知する\n\n    **コアイメージ：** 相手の頭の中に必要な情報を入れる。\n\n    「知らなかった人を、情報を知っている状態に変えるんです。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **staff**（スタッフ）\n\n    <text color=\"secondary\" size=\"xs\">/stæf/<\/text>\n\n    **意味：** 職員、従業員\n\n    **コアイメージ：** 組織や仕事を支える人たち。\n\n    「一人の従業員よりも、組織で働く人たち全体を意識する言葉です。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **meeting**（ミーティング）\n\n    <text color=\"secondary\" size=\"xs\">/ˈmiːtɪŋ/<\/text>\n\n    **意味：** 会議、集まり\n\n    **コアイメージ：** 人が一つの場所や機会に集まる。\n\n    「*meet*（会う）から生まれた単語ですね。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **take place**（テイク・プレイス）\n\n    <text color=\"secondary\" size=\"xs\">/teɪk pleɪs/<\/text>\n\n    **意味：** 開催される、起こる\n\n    **コアイメージ：** ある出来事が、現実の時間や場所の中で発生する。\n\n    「*place* が入っていますが、単に『場所を取る』という意味ではありませんよ。」\n  <\/box>\n<\/box>\n\n## B【詳しい解説｜文法と語順】\n\n「では先輩、英文を意味のまとまりで分けてみましょう。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">① 主語 S<\/text>\n    **The chair of the project committee**\n    <text size=\"sm\">プロジェクト委員会の委員長<\/text>\n  <\/box>\n  <box background=\"rgba(20,125,95,0.09)\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"success\" size=\"xs\">② 動詞 V（現在完了形）<\/text>\n    **has agreed**\n    <text size=\"sm\">同意した<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">③ 同意した内容<\/text>\n    **to inform the staff members**\n    <text size=\"sm\">スタッフに知らせること<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">④ 知らせる内容<\/text>\n    **of when the next meeting will take place**\n    <text size=\"sm\">次回の会議がいつ開催されるかを<\/text>\n  <\/box>\n<\/box>\n\n### ① has + 過去分詞\n\n「先輩、空欄の直前に *has* がありますよね。」\n\n「現在完了形では **has + 過去分詞** を使います。」\n\n- agree → agreed → agreed\n- decide → decided → decided\n- promise → promised → promised\n\n「だから *agree* を使う場合、空欄には *agreed* が入るんです。」\n\n### ② inform A of B\n\n「ここはTOEICでよく使われる構文ですよ。」\n\n**inform + 人 + of + 内容**\n\n例：\n\n*Please inform me of the schedule.*\n\n（私に予定を知らせてください。）\n\n「*inform me the schedule* としてしまわないように注意してくださいね。」\n\n### ③ when the next meeting will take place\n\n「先輩、ここは間接疑問文です。」\n\n直接疑問文：\n\n*When will the next meeting take place?*\n\n間接疑問文：\n\n*when the next meeting will take place*\n\n「間接疑問文では **疑問詞 + 主語 + 動詞** の順番になります。」\n\n## C【イメージ理解｜会社の会議を想像してください】\n\n「先輩が会社のプロジェクト委員会に参加しているとしましょう。」\n\n会議の最後に、誰かがこう言いました。\n\n「次の会議の日程は、誰がスタッフに連絡しますか？」\n\nすると委員長が、\n\n「分かりました。私が知らせます」\n\nと答えます。\n\n「これが *has agreed to inform* という状況です。」\n\n「相手からの依頼を受け入れ、自分がその仕事をすると同意したわけですね。」\n\n## D【類義語｜コアイメージ・読み方・ニュアンス】\n\n「先輩、今回は *agree* に似た単語を比較しましょう。」\n\n<box gap={3}>\n  <box gap={1}>\n    **1. agree（アグリー）**\n\n    <text color=\"secondary\" size=\"xs\">/əˈɡriː/<\/text>\n\n    **コアイメージ：** 相手と考えや意思が一致する。\n\n    **ニュアンス：** 提案や依頼を受け入れることに重点があります。\n\n    *She agreed to help.*\n\n    （彼女は手伝うことに同意しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. decide（ディサイド）**\n\n    <text color=\"secondary\" size=\"xs\">/dɪˈsaɪd/<\/text>\n\n    **コアイメージ：** 複数の選択肢から一つを選び、迷いを断ち切る。\n\n    **ニュアンス：** 他人への同意ではなく、自分で決定することに重点があります。\n\n    *He decided to leave.*\n\n    （彼は出発することを決めました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. promise（プロミス）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈprɑːmɪs/<\/text>\n\n    **コアイメージ：** 将来の行動について、守るべき約束をする。\n\n    **ニュアンス：** 同意するだけでなく、実行すると約束する意味が強いです。\n\n    *She promised to call.*\n\n    （彼女は電話すると約束しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. consent（コンセント）**\n\n    <text color=\"secondary\" size=\"xs\">/kənˈsent/<\/text>\n\n    **コアイメージ：** 相手の提案や行動に対して許可・同意を与える。\n\n    **ニュアンス：** *agree* より硬い表現で、正式な同意や許可に使われます。\n\n    *He consented to participate.*\n\n    （彼は参加することに同意しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. undertake（アンダーテイク）**\n\n    <text color=\"secondary\" size=\"xs\">/ˌʌndərˈteɪk/<\/text>\n\n    **コアイメージ：** 責任を持って仕事や役割を引き受ける。\n\n    **ニュアンス：** 単なる同意より、実際に責任を負って取り組むことを強調します。\n\n    *She undertook to complete the task.*\n\n    （彼女はその仕事を完了させることを引き受けました。）\n  <\/box>\n<\/box>\n\n「先輩、違いを一言で整理すると、*agree* は意思の一致、*decide* は決定、*promise* は約束、*consent* は正式な同意、*undertake* は責任を持って引き受けることです。」\n\n## 理解確認\n\n{@body const qs=[{q:\"The manager has ------- to provide additional training.\",opts:[\"agree\",\"agreeing\",\"agreed\",\"agreement\"],correct:2,why:\"has + 過去分詞なので agreed です。現在完了形を作ります。\"}, {q:\"Please inform the employees ------- the changes.\",opts:[\"of\",\"to\",\"for\",\"at\"],correct:0,why:\"inform A of B で「AにBを知らせる」です。\"}, {q:\"Do you know when the meeting ------- take place?\",opts:[\"does\",\"will\",\"is\",\"has\"],correct:1,why:\"when the meeting will take place は間接疑問文です。\"}]}\n{@body const [answers,setAnswers]=DIL.useState({})}\n{@body const [show,setShow]=DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box gap={2} key={i}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>{setAnswers(p=>({...p,[i]:Number(v)}));setShow(false)}}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{String.fromCharCode(65+j)}. {opt}<\/radio>\n        {/each}\n      <\/radio-group>\n      {#if show}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.correct?\"success\":\"default\"} weight=\"medium\">{answers[i]===q.correct?\"正解です！\":`正解：${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}`}<\/text>\n          <text size=\"sm\">{q.why}<\/text>\n        <\/box>\n      {/if}\n    <\/box>\n    {#if i<qs.length-1}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n  <button block disabled={Object.keys(answers).length!==3} onClick={()=>setShow(true)}>3問の答え合わせ<\/button>\n  {#if show}\n    <text weight=\"medium\" textAlign=\"center\">{qs.filter((q,i)=>answers[i]===q.correct).length} / 3 問正解<\/text>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n「はい、先輩。最後に今日の重要ポイントを確認しますよ。」\n\n- **agree**：意思が一致する → 同意する\n- **inform**：相手に情報を入れる → 知らせる\n- **chair**：会議の中心の席 → 議長\n- **committee**：特定の目的のために集まった人たち → 委員会\n- **take place**：出来事が現実に発生する → 開催される\n- **has + 過去分詞**：現在完了形\n- **inform A of B**：AにBを知らせる\n\n**一文で覚える：**\n\n*The manager has agreed to inform everyone of the meeting schedule.*\n\n（マネージャーは全員に会議の日程を知らせることに同意しました。）\n\n「先輩、今回は単語を単独で覚えるのではなく、それぞれのコアイメージと文法を結びつけてください。そうすれば、違う英文で出てきても意味をつかみやすくなりますからね。」"}, {"n": 6, "title": "The founder of XTC Electronics invited all of the firm’s ------- to a product launch party.", "raw": "## ⑥ The founder of XTC Electronics invited all of the firm’s ------- to a product launch party.\n\n**正解例：employees（従業員）**\n\n<text color=\"secondary\" size=\"sm\">発音：/ɪmˈplɔɪiːz/（エンプロイイーズ）<\/text>\n\n> The founder of XTC Electronics invited all of the firm’s **employees** to a product launch party.\n\n**和訳：** XTC Electronicsの創業者は、新製品の発売記念パーティーに会社の全従業員を招待しました。\n\n※選択肢がないため、*employees* は自然な解答例です。*clients*（顧客）や *executives*（幹部）なども文法的には入ります。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、今回のポイントは **all of the firm's + 複数名詞** という形です。」\n\n「まず、文の意味をつかみましょう。創業者が新製品の発売を記念して、会社の人たちをパーティーに招待している場面ですね。」\n\n### 重要単語とコアイメージ\n\n<box gap={3}>\n  <box gap={1}>\n    **1. founder（ファウンダー）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈfaʊndər/<\/text>\n\n    **意味：** 創業者、設立者\n\n    **コアイメージ：** 何もないところから組織や事業の土台を築く人。\n\n    「先輩、*found* には『設立する』という意味があります。*founder* は会社などを最初に作った人なんです。」\n\n    *The founder started the company in 2010.*\n\n    （創業者は2010年にその会社を設立しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. invite（インヴァイト）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪnˈvaɪt/<\/text>\n\n    **意味：** 招待する、誘う\n\n    **コアイメージ：** 相手に「こちらに来ませんか」と働きかける。\n\n    「単に情報を伝えるのではなく、相手に参加してもらおうとする行為なんです。」\n\n    *She invited me to dinner.*\n\n    （彼女は私を夕食に招待しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. firm（ファーム）**\n\n    <text color=\"secondary\" size=\"xs\">/fɜːrm/<\/text>\n\n    **意味：** 会社、企業\n\n    **コアイメージ：** 一つのまとまった事業組織。\n\n    「*firm* は形容詞だと『しっかりした、堅い』という意味もありますが、今回は名詞で『会社』ですよ。」\n\n    *She works for a law firm.*\n\n    （彼女は法律事務所で働いています。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. employee（エンプロイイー）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪmˈplɔɪiː/<\/text>\n\n    **意味：** 従業員、雇われて働く人\n\n    **コアイメージ：** 会社などに雇用され、仕事をする側の人。\n\n    「*employ* は『雇う』。そこに *-ee* が付くと『雇われる人』になります。」\n\n    *The company has 200 employees.*\n\n    （その会社には200人の従業員がいます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. launch（ローンチ）**\n\n    <text color=\"secondary\" size=\"xs\">/lɔːntʃ/<\/text>\n\n    **意味：** 発売する、開始する、打ち上げる\n\n    **コアイメージ：** 何かを勢いよく外の世界へ送り出す。\n\n    「ロケットを打ち上げるのも、新製品を市場に送り出すのも、同じ *launch* なんです。」\n\n    *The company launched a new product.*\n\n    （その会社は新製品を発売しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **6. product（プロダクト）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈprɑːdʌkt/<\/text>\n\n    **意味：** 製品、商品\n\n    **コアイメージ：** 生産活動によって生み出されたもの。\n\n    「*produce*（生産する）と関連する単語ですね。」\n\n    *This product is very popular.*\n\n    （この製品はとても人気があります。）\n  <\/box>\n<\/box>\n\n## B【詳しい解説｜文法と語順】\n\n「では先輩、文を意味のまとまりに分けていきますよ。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">主語 S<\/text>\n    **The founder of XTC Electronics**\n    <text size=\"sm\">XTC Electronicsの創業者は<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">動詞 V<\/text>\n    **invited**\n    <text size=\"sm\">招待した<\/text>\n  <\/box>\n  <box background=\"rgba(20,125,95,0.09)\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"success\" size=\"xs\">目的語 O<\/text>\n    **all of the firm's employees**\n    <text size=\"sm\">その会社の全従業員を<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">招待先<\/text>\n    **to a product launch party**\n    <text size=\"sm\">製品発売記念パーティーに<\/text>\n  <\/box>\n<\/box>\n\n### ① all of the firm's employees\n\n「先輩、ここを細かく見てみましょう。」\n\n- all of：〜のすべて\n- the firm's：その会社の\n- employees：従業員たち\n\n「*firm's* の **'s** は所有を表しています。つまり『会社の』という意味ですね。」\n\n「それから、*all of* が従業員全員を指しているので、*employee* ではなく複数形の *employees* が自然なんです。」\n\n### ② invite A to B\n\n「これはTOEICで覚えておきたい構文ですよ。」\n\n**invite + 人 + to + イベント・場所**\n\n*They invited us to the ceremony.*\n\n（彼らは私たちを式典に招待しました。）\n\n「*to* は招待する先を表しています。」\n\n### ③ product launch party\n\n「先輩、3つの名詞が並んでいますが、慌てないでください。」\n\n- product：製品\n- launch：発売\n- party：パーティー\n\n「後ろから考えると『パーティー → 発売のパーティー → 製品発売のパーティー』となります。」\n\n「こういう名詞の組み合わせは、ビジネス英語で頻繁に出てきますよ。」\n\n## C【イメージ理解｜会社の新製品発表会】\n\n「先輩、家電メーカーの創業者になったつもりで考えてください。」\n\n<AsyncImage query=\"modern electronics company product launch celebration employees corporate event presentation stage\" aspectRatio=\"16:9\" width=\"100%\"/>\n\n会社が数年間かけて開発した新製品が、ついに発売されます。\n\nそこで創業者は、開発担当者や営業担当者など、従業員全員を記念パーティーに招待しました。\n\n「このとき、招待されたのは会社に雇われている人たちですよね。」\n\n「だから *employees* が自然に当てはまるんです。」\n\n## D【類義語｜コアイメージ・読み方・ニュアンス】\n\n「先輩、*employee* に似た単語を比較しておきましょう。」\n\n<box gap={3}>\n  <box gap={1}>\n    **1. employee（エンプロイイー）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪmˈplɔɪiː/<\/text>\n\n    **コアイメージ：** 雇用されて働く人。\n\n    **ニュアンス：** 雇用関係を明確に表す言葉です。\n\n    *The company hired 20 new employees.*\n\n    （会社は20人の新しい従業員を雇いました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. staff（スタッフ）**\n\n    <text color=\"secondary\" size=\"xs\">/stæf/<\/text>\n\n    **コアイメージ：** 組織を支える働き手の集団。\n\n    **ニュアンス：** 従業員を集団として捉えることが多いです。\n\n    *The hotel staff were very helpful.*\n\n    （ホテルのスタッフはとても親切でした。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. worker（ワーカー）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈwɜːrkər/<\/text>\n\n    **コアイメージ：** 実際に労働する人。\n\n    **ニュアンス：** 雇用関係よりも、仕事や労働そのものに注目します。\n\n    *The factory employs 500 workers.*\n\n    （その工場は500人の労働者を雇用しています。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. personnel（パーソネル）**\n\n    <text color=\"secondary\" size=\"xs\">/ˌpɜːrsəˈnel/<\/text>\n\n    **コアイメージ：** 組織を構成する人的資源。\n\n    **ニュアンス：** 人事や組織管理など、ややフォーマルな文脈で使われます。\n\n    *All personnel must attend the training.*\n\n    （全職員は研修に参加しなければなりません。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. employer（エンプロイヤー）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪmˈplɔɪər/<\/text>\n\n    **コアイメージ：** 人を雇って仕事を与える側。\n\n    **ニュアンス：** *employee* の反対側の立場を表します。\n\n    *The employer provides health insurance.*\n\n    （雇用主は健康保険を提供しています。）\n  <\/box>\n<\/box>\n\n「先輩、特に **employee と employer** は混同しやすいので、注意してくださいね。」\n\n<box border radius=\"lg\" padding={3} gap={2} align=\"center\">\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>\n    **Employer**\n    <text size=\"sm\">雇用主・雇う側<\/text>\n  <\/box>\n  <icon name=\"arrow-down\" color=\"secondary\" size=\"lg\"/>\n  <text color=\"secondary\" size=\"xs\">employ（雇う）<\/text>\n  <icon name=\"arrow-down\" color=\"secondary\" size=\"lg\"/>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\" gap={1}>\n    **Employee**\n    <text size=\"sm\">従業員・雇われる側<\/text>\n  <\/box>\n<\/box>\n\n## 理解確認\n\n{@body const qs=[{q:\"The company has more than 300 -------.\",opts:[\"employ\",\"employer\",\"employees\",\"employment\"],correct:2,why:\"300人以上の従業員なので、複数形の employees が適切です。\"}, {q:\"All employees were invited ------- the event.\",opts:[\"to\",\"for\",\"at\",\"with\"],correct:0,why:\"invite A to B で「AをBに招待する」という意味です。\"}, {q:\"The company plans to ------- a new smartphone.\",opts:[\"launch\",\"launched\",\"launching\",\"launches\"],correct:0,why:\"plan to + 動詞の原形なので launch です。\"}]}\n{@body const [answers,setAnswers]=DIL.useState({})}\n{@body const [show,setShow]=DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>{setAnswers(p=>({...p,[i]:Number(v)}));setShow(false)}}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{String.fromCharCode(65+j)}. {opt}<\/radio>\n        {/each}\n      <\/radio-group>\n      {#if show}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.correct?\"success\":\"default\"} weight=\"medium\">{answers[i]===q.correct?\"正解です！\":`正解：${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}`}<\/text>\n          <text size=\"sm\">{q.why}<\/text>\n        <\/box>\n      {/if}\n    <\/box>\n    {#if i<qs.length-1}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n  <button block disabled={Object.keys(answers).length!==3} onClick={()=>setShow(true)}>3問の答え合わせ<\/button>\n  {#if show}\n    <text weight=\"medium\" textAlign=\"center\">{qs.filter((q,i)=>answers[i]===q.correct).length} / 3 問正解<\/text>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n「はい、先輩。今日の重要表現を最後に整理します。」\n\n- founder：土台を築いた人 → 創業者\n- invite：参加を呼びかける → 招待する\n- firm：事業を行う組織 → 会社\n- employee：雇われる側 → 従業員\n- employer：雇う側 → 雇用主\n- launch：世の中へ送り出す → 発売する\n- invite A to B：AをBに招待する\n\n**一文で覚える：**\n\n*The founder invited all employees to the product launch party.*\n\n（創業者は製品発売記念パーティーに全従業員を招待しました。）\n\n「先輩、今回の重要ポイントは、*employee* と *employer* の違い、そして *launch* の『世の中へ送り出す』というコアイメージです。この2つは別の英文でも使えるので、しっかり覚えておきましょうね。」"}, {"n": 7, "title": "Refreshments will be served at an informal ------- for conference attendees immediately after the closing address.", "raw": "## ⑦ Refreshments will be served at an informal ------- for conference attendees immediately after the closing address.\n\n**正解例：reception（懇親会・歓迎会・交流会）**\n\n<text color=\"secondary\" size=\"sm\">発音：/rɪˈsepʃən/（リセプション）<\/text>\n\n> Refreshments will be served at an informal **reception** for conference attendees immediately after the closing address.\n\n**和訳：** 閉会の挨拶の直後に、会議の参加者向けのカジュアルな懇親会が開かれ、軽食や飲み物が提供されます。\n\n※選択肢がないため、*reception* は文脈に合う自然な解答例です。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、今回のポイントは **reception のコアイメージ** と、空欄に入る品詞を見抜くことです。」\n\n「*reception* って聞くと、ホテルの受付を思い浮かべませんか？ 実は今回のように『懇親会』という意味でも使われるんです。」\n\n### 重要単語とコアイメージ\n\n<box gap={3}>\n  <box gap={1}>\n    **1. refreshments（リフレッシュメンツ）**\n\n    <text color=\"secondary\" size=\"xs\">/rɪˈfreʃmənts/<\/text>\n\n    **意味：** 軽食、飲み物\n\n    **コアイメージ：** 疲れた人をリフレッシュさせるための飲食物。\n\n    「先輩、*refresh* は『元気を回復させる』ですよね。そこから、会議の休憩時間などに出される飲み物や軽食を *refreshments* と呼ぶんです。」\n\n    *Refreshments will be provided after the meeting.*\n\n    （会議の後に軽食と飲み物が提供されます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. serve（サーヴ）**\n\n    <text color=\"secondary\" size=\"xs\">/sɜːrv/<\/text>\n\n    **意味：** 提供する、給仕する、役立つ\n\n    **コアイメージ：** 相手のために何かを差し出したり、役割を果たしたりする。\n\n    「料理を出すのも、お客様にサービスするのも、誰かのために働くというイメージでつながっています。」\n\n    *Dinner will be served at seven.*\n\n    （夕食は7時に提供されます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. informal（インフォーマル）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪnˈfɔːrməl/<\/text>\n\n    **意味：** 非公式な、形式ばらない、カジュアルな\n\n    **コアイメージ：** 決まった形式や堅苦しいルールに縛られていない。\n\n    「*formal* が『正式な、形式的な』ですから、否定の *in-* が付くと『形式ばらない』になります。」\n\n    *We had an informal discussion.*\n\n    （私たちは気軽な話し合いをしました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. reception（リセプション）**\n\n    <text color=\"secondary\" size=\"xs\">/rɪˈsepʃən/<\/text>\n\n    **意味：** 受付、歓迎会、懇親会、受信\n\n    **コアイメージ：** 外から来た人や物、情報を受け入れること。\n\n    「先輩、ここが大切ですよ。人を迎える場所なら『受付』、人を迎えて交流する催しなら『歓迎会・懇親会』、電波を受け取るなら『受信』です。」\n\n    *The company held a reception for its guests.*\n\n    （会社は来客のために歓迎会を開きました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. conference（カンファレンス）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈkɑːnfərəns/<\/text>\n\n    **意味：** 会議、協議会、学会\n\n    **コアイメージ：** 複数の人が集まり、情報や意見を持ち寄る。\n\n    「*meeting* よりも、規模が大きかったり、専門的なテーマを扱ったりする会議によく使われます。」\n\n    *She attended an international conference.*\n\n    （彼女は国際会議に参加しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **6. attendee（アテンディー）**\n\n    <text color=\"secondary\" size=\"xs\">/əˌtenˈdiː/<\/text>\n\n    **意味：** 出席者、参加者\n\n    **コアイメージ：** あるイベントや会議に出席する人。\n\n    「*attend* は『出席する』。そこから *attendee* で『出席する人』になります。」\n\n    *All attendees must register in advance.*\n\n    （参加者全員が事前に登録しなければなりません。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **7. immediately（イミーディアトリー）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪˈmiːdiətli/<\/text>\n\n    **意味：** 直ちに、すぐに\n\n    **コアイメージ：** 間に時間や出来事を挟まない。\n\n    「*immediately after* なら『〜の直後に』です。時間的な間隔がほとんどないことを表します。」\n\n    *Please contact us immediately.*\n\n    （すぐにご連絡ください。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **8. closing address（クロージング・アドレス）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈkloʊzɪŋ əˈdres/<\/text>\n\n    **意味：** 閉会の挨拶、締めくくりの演説\n\n    **コアイメージ：** イベントを締めくくるため、参加者に向けて言葉を届けること。\n\n    「*address* は『住所』だけではありません。人々に向けた正式なスピーチという意味もあるんです。」\n\n    *The director delivered the closing address.*\n\n    （責任者が閉会の挨拶を行いました。）\n  <\/box>\n<\/box>\n\n## B【詳しい解説｜文法と語順】\n\n「では先輩、文を意味のまとまりに分けてみましょう。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">主語 S<\/text>\n    **Refreshments**\n    <text size=\"sm\">軽食や飲み物が<\/text>\n  <\/box>\n  <box background=\"rgba(20,125,95,0.09)\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"success\" size=\"xs\">動詞 V（未来の受動態）<\/text>\n    **will be served**\n    <text size=\"sm\">提供されます<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">場所・イベント<\/text>\n    **at an informal reception**\n    <text size=\"sm\">カジュアルな懇親会で<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">対象者<\/text>\n    **for conference attendees**\n    <text size=\"sm\">会議の参加者向けの<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">時間<\/text>\n    **immediately after the closing address**\n    <text size=\"sm\">閉会の挨拶の直後に<\/text>\n  <\/box>\n<\/box>\n\n### ① will be served：未来の受動態\n\n「先輩、ここは **will + be + 過去分詞** という形ですね。」\n\n能動態：\n\n*The staff will serve refreshments.*\n\n（スタッフが軽食を提供します。）\n\n受動態：\n\n*Refreshments will be served.*\n\n（軽食が提供されます。）\n\n「誰が提供するかではなく、何が提供されるかに注目しているんです。」\n\n### ② an informal + 名詞\n\n「空欄の直前には *an informal* がありますね。」\n\n*informal* は形容詞ですから、後ろには名詞が必要です。\n\n**an + 形容詞 + 単数名詞**\n\n「今回なら *an informal reception* で『カジュアルな懇親会』になります。」\n\n### ③ immediately after\n\n「ここもセットで覚えてください。」\n\n- immediately before：〜の直前に\n- immediately after：〜の直後に\n\n「*immediately* が付くことで、時間的にすぐ前なのか、すぐ後なのかを強調しているんですよ。」\n\n## C【イメージ理解｜会議終了後の懇親会】\n\n「先輩、企業の大きなカンファレンスに参加していると想像してください。」\n\n<AsyncImage query=\"business conference informal networking reception people talking refreshments buffet after conference\" aspectRatio=\"16:9\" width=\"100%\"/>\n\n午後5時に閉会の挨拶が終わります。\n\nその直後、参加者たちは別の会場に移動し、飲み物や軽食を楽しみながら交流します。\n\n「この交流の場が *reception* です。」\n\n「そして、そこで提供される飲み物や軽食が *refreshments* なんです。」\n\n## D【類義語｜コアイメージ・読み方・ニュアンス】\n\n「先輩、今回は *reception* と似たイベントを表す単語を比較しましょう。」\n\n<box gap={3}>\n  <box gap={1}>\n    **1. reception（リセプション）**\n\n    <text color=\"secondary\" size=\"xs\">/rɪˈsepʃən/<\/text>\n\n    **コアイメージ：** 人を迎え入れ、交流する場。\n\n    **ニュアンス：** 会議や式典の前後に開かれる歓迎会・懇親会など。\n\n    *A reception will follow the conference.*\n\n    （会議の後に懇親会が開かれます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. gathering（ギャザリング）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈɡæðərɪŋ/<\/text>\n\n    **コアイメージ：** 人が一か所に集まること。\n\n    **ニュアンス：** 公式・非公式を問わず、幅広い集まりに使えます。\n\n    *We had a small gathering after work.*\n\n    （仕事の後に小さな集まりがありました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. banquet（バンクウィット）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈbæŋkwɪt/<\/text>\n\n    **コアイメージ：** 大勢で豪華な食事を楽しむ正式な宴会。\n\n    **ニュアンス：** *reception* より食事や式典としての格式が強いです。\n\n    *The company held an awards banquet.*\n\n    （会社は表彰式を兼ねた宴会を開きました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. networking event（ネットワーキング・イヴェント）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈnetwɜːrkɪŋ ɪˈvent/<\/text>\n\n    **コアイメージ：** 人と人のつながりを作るためのイベント。\n\n    **ニュアンス：** 人脈形成やビジネス上の交流が主な目的です。\n\n    *She attended a networking event.*\n\n    （彼女は交流イベントに参加しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. party（パーティー）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈpɑːrti/<\/text>\n\n    **コアイメージ：** 人が集まって楽しい時間を過ごす催し。\n\n    **ニュアンス：** 祝賀や娯楽の意味合いが強く、カジュアルな場面でも使えます。\n\n    *They organized a birthday party.*\n\n    （彼らは誕生日パーティーを企画しました。）\n  <\/box>\n<\/box>\n\n「先輩、特に *reception* と *banquet* の違いは覚えておきましょう。前者は人を迎えて交流すること、後者は正式な食事会という性格が強いんです。」\n\n## 理解確認\n\n{@body const qs=[{q:\"Light ------- will be provided during the break.\",opts:[\"refresh\",\"refreshments\",\"refreshing\",\"refreshed\"],correct:1,why:\"飲み物や軽食を表す名詞 refreshments が適切です。\"}, {q:\"The guests were invited to an informal -------.\",opts:[\"receive\",\"receptive\",\"reception\",\"receiving\"],correct:2,why:\"an informal の後には名詞が必要です。reception は懇親会という意味です。\"}, {q:\"The presentation will begin immediately ------- lunch.\",opts:[\"after\",\"during\",\"until\",\"since\"],correct:0,why:\"immediately after で「〜の直後に」という意味になります。\"}]}\n{@body const [answers,setAnswers]=DIL.useState({})}\n{@body const [show,setShow]=DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>{setAnswers(p=>({...p,[i]:Number(v)}));setShow(false)}}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{String.fromCharCode(65+j)}. {opt}<\/radio>\n        {/each}\n      <\/radio-group>\n      {#if show}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.correct?\"success\":\"default\"} weight=\"medium\">{answers[i]===q.correct?\"正解です！\":`正解：${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}`}<\/text>\n          <text size=\"sm\">{q.why}<\/text>\n        <\/box>\n      {/if}\n    <\/box>\n    {#if i<qs.length-1}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n  <button block disabled={Object.keys(answers).length!==3} onClick={()=>setShow(true)}>3問の答え合わせ<\/button>\n  {#if show}\n    <text weight=\"medium\" textAlign=\"center\">{qs.filter((q,i)=>answers[i]===q.correct).length} / 3 問正解<\/text>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n「はい、先輩。今日の重要ポイントをまとめますよ。」\n\n- refreshments：元気を回復させる飲食物 → 軽食・飲み物\n- serve：相手のために提供する\n- informal：形式に縛られない → カジュアルな\n- reception：人を迎え入れる → 受付・懇親会\n- attendee：出席する人 → 参加者\n- immediately after：間を置かずに → 直後に\n- closing address：イベントを締めくくる挨拶\n- will be + 過去分詞：未来の受動態\n\n**一文で覚える：**\n\n*Refreshments will be served at the reception.*\n\n（懇親会では軽食と飲み物が提供されます。）\n\n「先輩、今回は *reception* の『受け入れる』というコアイメージが一番重要です。受付・歓迎会・受信という複数の意味を、一つのイメージでつなげて覚えてくださいね。」"}, {"n": 8, "title": "------- new employees at Bibliac Publishing have completed six months of service, they are entitled to two weeks of paid leave.", "raw": "## ⑧ ------- new employees at Bibliac Publishing have completed six months of service, they are entitled to two weeks of paid leave.\n\n**正解例：Once（いったん〜すれば、〜すると）**\n\n<text color=\"secondary\" size=\"sm\">発音：/wʌns/（ワンス）<\/text>\n\n> **Once** new employees at Bibliac Publishing have completed six months of service, they are entitled to two weeks of paid leave.\n\n**和訳：** Bibliac Publishingの新入社員は、勤続6か月を終えると、2週間の有給休暇を取得する権利が与えられます。\n\n※選択肢がないため、*Once* は自然な解答例です。*When*（〜するとき）や *After*（〜した後）も文法的には可能です。\n\n## A【要点｜まず全体を掴みましょう】\n\n「先輩、今回の英文は、会社の福利厚生に関する説明ですね。重要なのは **Once A, B（Aという条件が満たされると、Bになる）** という構造です。」\n\n「特に *once* は『一度』という意味だけで覚えていると、この文章で戸惑ってしまいますよ。」\n\n### 重要単語とコアイメージ\n\n<box gap={3}>\n  <box gap={1}>\n    **1. once（ワンス）**\n\n    <text color=\"secondary\" size=\"xs\">/wʌns/<\/text>\n\n    **意味：** 一度、かつて、いったん〜すると\n\n    **コアイメージ：** ある出来事が一度成立する、その瞬間を境目として捉える。\n\n    「先輩、ここが最重要です。*once* は単に回数を表すだけではありません。ある条件が成立したら、そこから次の状態に切り替わるというイメージなんです。」\n\n    *Once you finish your work, you can go home.*\n\n    （仕事を終えたら、帰宅できます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. employee（エンプロイイー）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪmˈplɔɪiː/<\/text>\n\n    **意味：** 従業員\n\n    **コアイメージ：** 会社に雇われて働く側の人。\n\n    「前の英文でも登場しましたね。*employer* は雇う側、*employee* は雇われる側です。」\n\n    *New employees receive training.*\n\n    （新入社員は研修を受けます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. publishing（パブリシング）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈpʌblɪʃɪŋ/<\/text>\n\n    **意味：** 出版、出版業\n\n    **コアイメージ：** 情報や作品を一般の人々に向けて世の中へ出すこと。\n\n    「*publish* は『出版する、公表する』です。*publishing* は出版という活動や業界を表します。」\n\n    *She works in publishing.*\n\n    （彼女は出版業界で働いています。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. complete（コンプリート）**\n\n    <text color=\"secondary\" size=\"xs\">/kəmˈpliːt/<\/text>\n\n    **意味：** 完了する、完成させる\n\n    **コアイメージ：** 必要なものがすべてそろい、欠けた部分がなくなる。\n\n    「先輩、今回なら『勤続6か月という期間をすべて終える』という意味ですね。」\n\n    *She completed the training program.*\n\n    （彼女は研修プログラムを修了しました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. service（サーヴィス）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈsɜːrvɪs/<\/text>\n\n    **意味：** 奉仕、業務、勤務、サービス\n\n    **コアイメージ：** 誰かや組織のために役割を果たすこと。\n\n    「今回は接客サービスではなく、会社に勤めて働くことを表しています。」\n\n    *He has ten years of service with the company.*\n\n    （彼はその会社で10年間勤務しています。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **6. entitled（エンタイトルド）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪnˈtaɪtəld/<\/text>\n\n    **意味：** 権利がある、資格がある\n\n    **コアイメージ：** ある条件や立場によって、何かを受け取ったり利用したりする正当な権利が認められている。\n\n    「先輩、*be entitled to ～* はTOEICで非常に重要です。単に『できる』ではなく、『権利として認められている』という意味ですよ。」\n\n    *Employees are entitled to paid leave.*\n\n    （従業員には有給休暇を取得する権利があります。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **7. paid leave（ペイド・リーヴ）**\n\n    <text color=\"secondary\" size=\"xs\">/peɪd liːv/<\/text>\n\n    **意味：** 有給休暇\n\n    **コアイメージ：** 給与を受け取りながら、仕事から離れることが認められた期間。\n\n    「*paid* は『支払われた』、*leave* は名詞で『休暇』です。合わせて『給与が支払われる休暇』になります。」\n\n    *She took three days of paid leave.*\n\n    （彼女は3日間の有給休暇を取りました。）\n  <\/box>\n<\/box>\n\n## B【詳しい解説｜文法と語順】\n\n「先輩、今回の英文は、前半が条件、後半が結果という構造になっています。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <box background=\"rgba(20,125,95,0.09)\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"success\" size=\"xs\">条件を示す接続詞<\/text>\n    **Once**\n    <text size=\"sm\">いったん〜すると<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">条件を表す節<\/text>\n    **new employees at Bibliac Publishing have completed six months of service**\n    <text size=\"sm\">Bibliac Publishingの新入社員が勤続6か月を終えると<\/text>\n  <\/box>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n    <text color=\"secondary\" size=\"xs\">主節（結果）<\/text>\n    **they are entitled to two weeks of paid leave**\n    <text size=\"sm\">彼らには2週間の有給休暇を取得する権利がある<\/text>\n  <\/box>\n<\/box>\n\n### ① Once + 主語 + 動詞\n\n「先輩、*once* の後ろには、主語と動詞が続いていますね。」\n\n**Once + S + V, S + V**\n\nこの形で「いったん〜すると、…になる」という意味を表します。\n\n*Once you register, you can use the service.*\n\n（登録すると、そのサービスを利用できます。）\n\n「条件が成立した後に、何かが可能になるという流れを意識してください。」\n\n### ② have completed：現在完了形\n\n「今回の英文では *have completed* という現在完了形が使われています。」\n\n**have + 過去分詞**\n\nここでは、勤続6か月という期間を完了した状態を表しています。\n\n「*once* と組み合わさることで、『6か月の勤務を終えた時点で』という意味になるんです。」\n\n### ③ be entitled to + 名詞\n\n「先輩、これはぜひ覚えてください。」\n\n**be entitled to + 名詞**\n\n「〜を受ける権利がある」\n\n*You are entitled to a refund.*\n\n（あなたには返金を受ける権利があります。）\n\nただし、後ろに動詞を置く場合は、\n\n**be entitled to + 動詞の原形**\n\nという形もあります。\n\n*You are entitled to receive a refund.*\n\n（あなたには返金を受ける権利があります。）\n\n「*to* の後ろが名詞なのか、動詞なのかを見極めてくださいね。」\n\n### ④ two weeks of paid leave\n\n「ここは数量表現です。」\n\n**数量 + of + 名詞**\n\n- two weeks of paid leave：2週間の有給休暇\n- three days of training：3日間の研修\n- five years of experience：5年間の経験\n\n「期間と、その期間に何をするのかを結びつける表現なんです。」\n\n## C【イメージ理解｜入社6か月後の有給休暇】\n\n「先輩、4月1日に出版社へ入社した新入社員を想像してください。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <row align=\"center\" justify=\"between\">\n    <box gap=\"1px\">\n      <text weight=\"medium\">4月1日<\/text>\n      <text color=\"secondary\" size=\"xs\">入社<\/text>\n    <\/box>\n    <icon name=\"arrow-right\" color=\"tertiary\"/>\n    <box gap=\"1px\">\n      <text weight=\"medium\">6か月間<\/text>\n      <text color=\"secondary\" size=\"xs\">勤務を継続<\/text>\n    <\/box>\n    <icon name=\"arrow-right\" color=\"tertiary\"/>\n    <box gap=\"1px\">\n      <text weight=\"medium\">10月1日<\/text>\n      <text color=\"secondary\" size=\"xs\">条件達成<\/text>\n    <\/box>\n  <\/row>\n  <divider color=\"subtle\"/>\n  <row align=\"center\" gap={2}>\n    <icon name=\"check-circle\" color=\"success\" size=\"lg\"/>\n    <box flex=\"1\" gap={1}>\n      **2週間の有給休暇を取得する権利が発生**\n\n      <text color=\"secondary\" size=\"xs\">英文中の会社制度を例にしたイメージです。実際の法定有給休暇制度とは区別してください。<\/text>\n    <\/box>\n  <\/row>\n<\/box>\n\n「先輩、ここで重要なのは、6か月の勤務を終えるという条件が満たされることで、休暇の権利が生まれるということです。」\n\n「この『条件達成を境に状態が変わる』感覚が、*once* のコアイメージなんですよ。」\n\n## D【類義語｜コアイメージ・読み方・ニュアンス】\n\n「では先輩、*once* に似た接続詞を比較しましょう。」\n\n<box gap={3}>\n  <box gap={1}>\n    **1. once（ワンス）**\n\n    <text color=\"secondary\" size=\"xs\">/wʌns/<\/text>\n\n    **コアイメージ：** ある条件が成立した瞬間を境目にする。\n\n    **ニュアンス：** 条件が満たされた後の変化に重点があります。\n\n    *Once you finish the report, send it to me.*\n\n    （報告書を完成させたら、私に送ってください。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. when（ウェン）**\n\n    <text color=\"secondary\" size=\"xs\">/wen/<\/text>\n\n    **コアイメージ：** ある出来事が起こる時間・タイミングを指す。\n\n    **ニュアンス：** 条件というより、出来事が起こる時点に注目します。\n\n    *When the meeting ends, we will leave.*\n\n    （会議が終わったら、私たちは出発します。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. after（アフター）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈæftər/<\/text>\n\n    **コアイメージ：** ある出来事より時間的に後ろに位置する。\n\n    **ニュアンス：** 2つの出来事の前後関係を強調します。\n\n    *After you complete the training, you can begin work.*\n\n    （研修を終えた後、仕事を始められます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. as soon as（アズ・スーン・アズ）**\n\n    <text color=\"secondary\" size=\"xs\">/əz suːn əz/<\/text>\n\n    **コアイメージ：** ある出来事が起こったら、間を置かず次のことが起こる。\n\n    **ニュアンス：** *once* よりも、時間的な即時性を強調します。\n\n    *Call me as soon as you arrive.*\n\n    （到着したらすぐに電話してください。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. if（イフ）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪf/<\/text>\n\n    **コアイメージ：** ある条件が成立する場合を仮定する。\n\n    **ニュアンス：** 条件が実際に成立するかどうかは分かりません。\n\n    *If you complete the training, you will receive a certificate.*\n\n    （研修を修了すれば、修了証を受け取れます。）\n  <\/box>\n<\/box>\n\n「先輩、特に *once* と *if* の違いを覚えてください。*once* は『条件が達成されたら』、*if* は『条件が達成されるなら』という感覚です。」\n\n## 理解確認\n\n{@body const qs=[{q:\"------- you complete the training, you will receive a certificate.\",opts:[\"Once\",\"Despite\",\"During\",\"Unless\"],correct:0,why:\"条件が達成された後の結果を表すので Once が適切です。\"}, {q:\"Employees are entitled ------- paid leave.\",opts:[\"for\",\"to\",\"with\",\"at\"],correct:1,why:\"be entitled to + 名詞で「〜を受ける権利がある」です。\"}, {q:\"She has ------- six months of service.\",opts:[\"complete\",\"completing\",\"completed\",\"completion\"],correct:2,why:\"現在完了形 has + 過去分詞なので completed です。\"}]}\n{@body const [answers,setAnswers]=DIL.useState({})}\n{@body const [show,setShow]=DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>{setAnswers(p=>({...p,[i]:Number(v)}));setShow(false)}}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{String.fromCharCode(65+j)}. {opt}<\/radio>\n        {/each}\n      <\/radio-group>\n      {#if show}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.correct?\"success\":\"default\"} weight=\"medium\">{answers[i]===q.correct?\"正解です！\":`正解：${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}`}<\/text>\n          <text size=\"sm\">{q.why}<\/text>\n        <\/box>\n      {/if}\n    <\/box>\n    {#if i<qs.length-1}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n  <button block disabled={Object.keys(answers).length!==3} onClick={()=>setShow(true)}>3問の答え合わせ<\/button>\n  {#if show}\n    <text weight=\"medium\" textAlign=\"center\">{qs.filter((q,i)=>answers[i]===q.correct).length} / 3 問正解<\/text>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n「はい、先輩。今日の重要ポイントを整理します。」\n\n- once：条件が成立する境目 → いったん〜すると\n- employee：雇われる側 → 従業員\n- complete：欠けた部分がなくなる → 完了する\n- service：組織のために働く → 勤務\n- entitled：正当な権利を持つ → 権利がある\n- paid leave：給与を受け取りながら休む → 有給休暇\n- be entitled to：〜を受ける権利がある\n\n**一文で覚える：**\n\n*Once employees complete six months of service, they are entitled to paid leave.*\n\n（従業員は勤続6か月を終えると、有給休暇を取得する権利が与えられます。）\n\n「先輩、今回の最重要ポイントは、*once* の『条件が成立した瞬間を境目にする』というコアイメージです。*when* や *if* との違いも意識して覚えてくださいね。」"}, {"n": 9, "title": "The accounting department has confirmed that the current budget is ------- to proceed with the training initiative.", "raw": "# ⑨ The accounting department has confirmed that the current budget is ------- to proceed with the training initiative.\n\n**正解例：sufficient（十分な）**\n\n<text color=\"secondary\" size=\"sm\">発音：/səˈfɪʃənt/（サフィシェント）<\/text>\n\n> The accounting department has confirmed that the current budget is **sufficient** to proceed with the training initiative.\n\n**和訳：** 経理部は、現在の予算が研修計画を進めるのに十分であることを確認しました。\n\n※選択肢がないため、*sufficient* は自然な解答例です。*adequate*（必要な水準を満たした）なども入ります。\n\n「先輩、今回はご希望どおり、**単語のコアイメージに加えて、チャンク全体のコアイメージ**も入れますね。単語を一つずつ日本語に変換するだけでは、長文を読む速度はなかなか上がりません。意味のまとまりを頭の中で映像にする練習をしましょう。」\n\n## A【要点｜英文全体をつかみましょう】\n\nこの文の中心は、次の2つです。\n\n- **has confirmed that ～**：〜ということを確認した\n- **be sufficient to do ～**：〜するのに十分である\n\n「つまり、経理部が予算を確認した結果、研修計画を実行するのに十分なお金があると分かった、という文章です。」\n\n## B【チャンク別解説｜意味とコアイメージ】\n\n「先輩、今回は英文を6つのチャンクに分けます。一つのチャンクを読んだら、その場で意味をつかんでから次に進んでくださいね。」\n\n<box border radius=\"xl\" padding={3} gap={3}>\n  <box gap={2}>\n    <row align=\"center\" justify=\"between\">\n      **チャンク①**\n      <badge color=\"secondary\">誰が？<\/badge>\n    <\/row>\n    <title size=\"lg\">The accounting department<\/title>\n    <text color=\"secondary\" size=\"sm\">ジ・アカウンティング・ディパートメント<\/text>\n    **意味：** 経理部は\n\n    **コアイメージ：** 会社のお金の流れや予算を管理している部署。\n\n    「先輩、ここを読んだ瞬間に、会社の経理部の人たちが予算表を確認している場面を思い浮かべてください。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={2}>\n    <row align=\"center\" justify=\"between\">\n      **チャンク②**\n      <badge color=\"secondary\">何をした？<\/badge>\n    <\/row>\n    <title size=\"lg\">has confirmed that<\/title>\n    <text color=\"secondary\" size=\"sm\">ハズ・コンファームド・ザット<\/text>\n    **意味：** 〜ということを確認した\n\n    **コアイメージ：** 曖昧だった情報を調べ、確かなものとして確定させる。\n\n    「ここでは、経理部が数字を確認して『間違いありません』と判断する場面です。*that* の後ろには、何を確認したのかが続きます。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={2}>\n    <row align=\"center\" justify=\"between\">\n      **チャンク③**\n      <badge color=\"secondary\">何について？<\/badge>\n    <\/row>\n    <title size=\"lg\">the current budget<\/title>\n    <text color=\"secondary\" size=\"sm\">ザ・カレント・バジェット<\/text>\n    **意味：** 現在の予算が\n\n    **コアイメージ：** 今使えるお金の枠。\n\n    「*current* は『今の』、*budget* は『予算』です。今この計画に使える金額を思い浮かべてください。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={2}>\n    <row align=\"center\" justify=\"between\">\n      **チャンク④**\n      <badge color=\"success\">どんな状態？<\/badge>\n    <\/row>\n    <title size=\"lg\">is sufficient<\/title>\n    <text color=\"secondary\" size=\"sm\">イズ・サフィシェント<\/text>\n    **意味：** 十分である\n\n    **コアイメージ：** 必要な基準を超えていて、目的を達成できる状態。\n\n    「予算が必要額に届いているイメージです。ただし、余裕がたっぷりあるとは限りません。必要な分が満たされていれば *sufficient* と言えるんです。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={2}>\n    <row align=\"center\" justify=\"between\">\n      **チャンク⑤**\n      <badge color=\"secondary\">何をするために？<\/badge>\n    <\/row>\n    <title size=\"lg\">to proceed with<\/title>\n    <text color=\"secondary\" size=\"sm\">トゥ・プロシード・ウィズ<\/text>\n    **意味：** 〜を進めるために\n\n    **コアイメージ：** 準備や確認を終えて、計画を前に進める。\n\n    「ここで重要なのは、単に『進む』ではなく、ある仕事や計画を実際に進行させる感覚です。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={2}>\n    <row align=\"center\" justify=\"between\">\n      **チャンク⑥**\n      <badge color=\"secondary\">何を進める？<\/badge>\n    <\/row>\n    <title size=\"lg\">the training initiative<\/title>\n    <text color=\"secondary\" size=\"sm\">ザ・トレイニング・イニシアティヴ<\/text>\n    **意味：** 研修計画・研修施策を\n\n    **コアイメージ：** 社員の能力向上を目的として、新しく企画された取り組み。\n\n    「*initiative* は単なる予定ではなく、目的を持って積極的に始める取り組みを表します。」\n  <\/box>\n<\/box>\n\n### チャンクをつなげるとどうなる？\n\n<box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}>\n  <text color=\"secondary\" weight=\"medium\" size=\"xs\">英語の語順のまま理解する<\/text>\n  <text weight=\"medium\">The accounting department<\/text>\n  経理部は\n  <row justify=\"center\"><icon name=\"arrow-down\" color=\"tertiary\"/><\/row>\n  <text weight=\"medium\">has confirmed that<\/text>\n  〜ということを確認した\n  <row justify=\"center\"><icon name=\"arrow-down\" color=\"tertiary\"/><\/row>\n  <text weight=\"medium\">the current budget is sufficient<\/text>\n  現在の予算は十分である\n  <row justify=\"center\"><icon name=\"arrow-down\" color=\"tertiary\"/><\/row>\n  <text weight=\"medium\">to proceed with the training initiative.<\/text>\n  研修計画を進めるために\n<\/box>\n\n「先輩、ここで英文を最初から読み直してみてください。『経理部が → 確認した → 予算は十分だと → 研修計画を進めるのに』という順番で理解できれば、最後まで読んでから訳し直す必要がなくなります。」\n\n## C【重要単語｜コアイメージ・読み方・具体例】\n\n<box gap={3}>\n  <box gap={1}>\n    **1. accounting（アカウンティング）**\n\n    <text color=\"secondary\" size=\"xs\">/əˈkaʊntɪŋ/<\/text>\n\n    **意味：** 会計、経理\n\n    **コアイメージ：** お金の動きを記録し、数字で説明できるようにすること。\n\n    *She works in accounting.*\n\n    （彼女は経理部門で働いています。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. department（ディパートメント）**\n\n    <text color=\"secondary\" size=\"xs\">/dɪˈpɑːrtmənt/<\/text>\n\n    **意味：** 部署、部門\n\n    **コアイメージ：** 組織全体を役割ごとに分けた一つの区画。\n\n    *He works in the sales department.*\n\n    （彼は営業部で働いています。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. confirm（コンファーム）**\n\n    <text color=\"secondary\" size=\"xs\">/kənˈfɜːrm/<\/text>\n\n    **意味：** 確認する、確定する\n\n    **コアイメージ：** 不確かな情報を、確かな状態にする。\n\n    *Please confirm the meeting date.*\n\n    （会議の日付を確認してください。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. current（カレント）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈkɜːrənt/<\/text>\n\n    **意味：** 現在の、今の\n\n    **コアイメージ：** 今という時点に存在し、動いているもの。\n\n    *Our current plan is working well.*\n\n    （現在の計画は順調に進んでいます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. budget（バジェット）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈbʌdʒɪt/<\/text>\n\n    **意味：** 予算\n\n    **コアイメージ：** 使えるお金にあらかじめ設定された枠。\n\n    *We need to stay within the budget.*\n\n    （私たちは予算内に収める必要があります。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **6. sufficient（サフィシェント）**\n\n    <text color=\"secondary\" size=\"xs\">/səˈfɪʃənt/<\/text>\n\n    **意味：** 十分な\n\n    **コアイメージ：** 目的を達成するために必要な量や水準を満たしている。\n\n    *We have sufficient funds to start the project.*\n\n    （私たちにはプロジェクトを始めるのに十分な資金があります。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **7. proceed（プロシード）**\n\n    <text color=\"secondary\" size=\"xs\">/prəˈsiːd/<\/text>\n\n    **意味：** 進む、続行する\n\n    **コアイメージ：** 止まらず、次の段階へ前進する。\n\n    *We can proceed with the project.*\n\n    （私たちはプロジェクトを進められます。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **8. initiative（イニシアティヴ）**\n\n    <text color=\"secondary\" size=\"xs\">/ɪˈnɪʃətɪv/<\/text>\n\n    **意味：** 新しい取り組み、施策、主導権\n\n    **コアイメージ：** 自ら動き出して、物事を始めたり前に進めたりする力。\n\n    *The company launched a new training initiative.*\n\n    （会社は新しい研修施策を開始しました。）\n  <\/box>\n<\/box>\n\n## D【イメージ理解｜会社の予算会議】\n\n「先輩、実際の仕事に置き換えて考えてみましょう。」\n\n会社が社員向けの研修を計画しています。しかし、予算が足りるか分かりません。\n\n<box border radius=\"lg\" padding={3} gap={3}>\n  <text weight=\"medium\">例：研修計画の予算確認<\/text>\n  <grid columns={2} gap={2}>\n    <grid-item>\n      <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n        <text color=\"secondary\" size=\"xs\">研修に必要な費用<\/text>\n        <title size=\"xl\" color=\"default\" tabularNums>80万円<\/title>\n      <\/box>\n    <\/grid-item>\n    <grid-item>\n      <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1}>\n        <text color=\"secondary\" size=\"xs\">現在の予算<\/text>\n        <title size=\"xl\" color=\"default\" tabularNums>100万円<\/title>\n      <\/box>\n    <\/grid-item>\n  <\/grid>\n  <box gap={1}>\n    <row justify=\"between\">\n      <text size=\"sm\">必要な費用<\/text>\n      <text size=\"sm\" weight=\"medium\" tabularNums>80%<\/text>\n    <\/row>\n    <box background=\"surface-tertiary\" height=\"15px\" radius=\"full\" clip>\n      <box background=\"rgba(35,140,110,0.8)\" width=\"80%\" height=\"100%\" radius=\"full\"/>\n    <\/box>\n  <\/box>\n  <row align=\"center\" gap={2}>\n    <icon name=\"check-circle\" color=\"success\" size=\"lg\"/>\n    <box flex=\"1\" gap={1}>\n      **The budget is sufficient.**\n      <text color=\"secondary\" size=\"sm\">予算が必要額を満たしているため、計画を進められる。<\/text>\n    <\/box>\n  <\/row>\n<\/box>\n\n「ここで、予算が50万円しかなかったらどうでしょう？」\n\n「必要額の80万円に届きませんから、*The budget is insufficient.*（予算が不十分です）となります。」\n\n「つまり *sufficient* は、金額が大きいか小さいかではなく、**必要な基準を満たしているか**が判断の中心なんです。」\n\n## E【類義語｜コアイメージとニュアンスの違い】\n\n「先輩、*sufficient* に似た単語も覚えておきましょう。」\n\n| 単語・読み方 | コアイメージ・ニュアンス |\n|---|---|\n| **sufficient**（サフィシェント） | 目的達成に必要な量を満たす。ややフォーマル |\n| **enough**（イナフ） | 必要なだけある。日常的で幅広い |\n| **adequate**（アディクウィット） | 求められる最低限の水準を満たす |\n| **ample**（アンプル） | 必要量を超えて、余裕が十分にある |\n| **insufficient**（インサフィシェント） | 必要な量や水準に達していない |\n\n「例文でも違いを確認してください。」\n\n**sufficient** /səˈfɪʃənt/\n\n*We have sufficient time to finish the task.*\n\n（仕事を終えるのに十分な時間があります。）\n\n**enough** /ɪˈnʌf/\n\n*We have enough money to buy the equipment.*\n\n（その設備を買うのに十分なお金があります。）\n\n**adequate** /ˈædɪkwət/\n\n*The facilities are adequate for our needs.*\n\n（設備は私たちの必要な水準を満たしています。）\n\n**ample** /ˈæmpəl/\n\n*We have ample time to prepare.*\n\n（準備する時間はたっぷりあります。）\n\n**insufficient** /ˌɪnsəˈfɪʃənt/\n\n*The funds are insufficient to complete the project.*\n\n（そのプロジェクトを完成させるには資金が不足しています。）\n\n## 理解確認\n\n{@body const qs=[{q:\"The company has ------- funds to expand its operations.\",opts:[\"sufficient\",\"sufficiency\",\"sufficiently\",\"suffice\"],correct:0,why:\"funds という名詞を修飾する形容詞 sufficient が必要です。\"}, {q:\"We are ready to proceed ------- the plan.\",opts:[\"at\",\"on\",\"with\",\"for\"],correct:2,why:\"proceed with + 名詞で「〜を進める」です。\"}, {q:\"The accounting department has confirmed ------- the budget is sufficient.\",opts:[\"what\",\"that\",\"who\",\"where\"],correct:1,why:\"confirmed that + 文で「〜ということを確認した」です。\"}]}\n{@body const [answers,setAnswers]=DIL.useState({})}\n{@body const [show,setShow]=DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>{setAnswers(p=>({...p,[i]:Number(v)}));setShow(false)}}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{String.fromCharCode(65+j)}. {opt}<\/radio>\n        {/each}\n      <\/radio-group>\n      {#if show}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.correct?\"success\":\"default\"} weight=\"medium\">{answers[i]===q.correct?\"正解です！\":`正解：${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}`}<\/text>\n          <text size=\"sm\">{q.why}<\/text>\n        <\/box>\n      {/if}\n    <\/box>\n    {#if i<qs.length-1}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n  <button block disabled={Object.keys(answers).length!==3} onClick={()=>setShow(true)}>3問の答え合わせ<\/button>\n  {#if show}\n    <text weight=\"medium\" textAlign=\"center\">{qs.filter((q,i)=>answers[i]===q.correct).length} / 3 問正解<\/text>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n「先輩、最後に今日の内容をまとめますよ。」\n\n- accounting department：お金の流れを管理する部署 → 経理部\n- confirm：不確かなことを確かにする → 確認する\n- current budget：現在使えるお金の枠 → 現在の予算\n- sufficient：必要な基準を満たす → 十分な\n- proceed with：計画を前に進める → 〜を進める\n- training initiative：研修を通じて改善する取り組み → 研修施策\n\n**一文で覚える：**\n\n*The budget is sufficient to proceed with the training initiative.*\n\n（その予算は研修計画を進めるのに十分です。）\n\n「先輩、次からも**単語のコアイメージ・読み方・チャンクごとの意味とイメージ・文法・類義語の違い**をセットで解説しますね。単語を覚えるだけでなく、英語の語順のまま理解する力も一緒に鍛えていきましょう。」"}, {"n": 10, "title": "The city’s centennial celebrations on the weekend of November 17 will make ------- difficult to find downtown accommodation.", "raw": "## ⑩ The city’s centennial celebrations on the weekend of November 17 will make ------- difficult to find downtown accommodation.\n\n**正解：it（形式目的語）**\n\n<text color=\"secondary\" size=\"sm\">発音：/ɪt/（イット）<\/text>\n\n> The city’s centennial celebrations on the weekend of November 17 will make **it** difficult to find downtown accommodation.\n\n**和訳：** 11月17日を含む週末に開催される市の創立100周年記念行事によって、中心街で宿泊施設を見つけることが難しくなるでしょう。\n\n「先輩、今回はかなり重要な文法問題ですよ。空欄に入る *it* は、普通の『それ』とは違います。**後ろにある長い内容を仮に受け止める it** なんです。」\n\n## A【要点｜まず全体をつかみましょう】\n\n今回の重要構文は、\n\n**make it + 形容詞 + to do**\n\n「〜することを…な状態にする」\n\nです。\n\n「先輩、今回の英文では、記念行事によって宿泊施設を探すのが難しくなる、という因果関係を表しています。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <text color=\"secondary\" weight=\"medium\" size=\"xs\">今回の因果関係<\/text>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1} align=\"center\">\n    **市の創立100周年記念行事**\n    <text color=\"secondary\" size=\"sm\">多くの観光客が訪れる<\/text>\n  <\/box>\n  <row justify=\"center\"><icon name=\"arrow-down\" color=\"secondary\"/><\/row>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} gap={1} align=\"center\">\n    **宿泊施設の需要が増える**\n    <text color=\"secondary\" size=\"sm\">ホテルの空室が減る<\/text>\n  <\/box>\n  <row justify=\"center\"><icon name=\"arrow-down\" color=\"secondary\"/><\/row>\n  <box background=\"rgba(20,125,95,0.08)\" radius=\"md\" padding={3} gap={1} align=\"center\">\n    **宿泊施設を見つけるのが難しくなる**\n    <text color=\"secondary\" size=\"sm\">make it difficult to find accommodation<\/text>\n  <\/box>\n<\/box>\n\n「もちろん、観光客の増加や空室の減少は英文から考えられる背景であって、直接書かれているわけではありません。でも、この因果関係をイメージすると英文が理解しやすくなりますね。」\n\n## B【チャンク別解説｜意味・読み方・コアイメージ】\n\n「先輩、英文を6つに区切って、英語の語順のまま理解していきましょう。」\n\n<box border radius=\"xl\" padding={3} gap={3}>\n  <box gap={1}>\n    <text color=\"secondary\" size=\"xs\">チャンク①｜何が原因？<\/text>\n    **The city's centennial celebrations**\n\n    <text color=\"secondary\" size=\"sm\">ザ・シティーズ・センテニアル・セレブレイションズ<\/text>\n\n    **意味：** 市の100周年記念行事が\n\n    **チャンクのコアイメージ：** 街全体が100周年を祝うために、大きなイベントを開催している。\n\n    「*centennial* が100周年、*celebrations* がお祝いの行事です。街の記念イベントを頭に浮かべてください。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    <text color=\"secondary\" size=\"xs\">チャンク②｜いつ？<\/text>\n    **on the weekend of November 17**\n\n    <text color=\"secondary\" size=\"sm\">オン・ザ・ウィークエンド・オヴ・ノウヴェンバー・セヴンティーン<\/text>\n\n    **意味：** 11月17日を含む週末に\n\n    **チャンクのコアイメージ：** カレンダーの11月17日付近の土日を指し示す。\n\n    「ここはイベントの開催時期を補足しています。特定の週末を指しているんですね。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    <text color=\"secondary\" size=\"xs\">チャンク③｜何を引き起こす？<\/text>\n    **will make it**\n\n    <text color=\"secondary\" size=\"sm\">ウィル・メイク・イット<\/text>\n\n    **意味：** それを〜な状態にするだろう\n\n    **チャンクのコアイメージ：** ある出来事が原因となり、後ろに出てくる行動の難易度を変える。\n\n    「先輩、この *it* は後ろの *to find downtown accommodation* を仮に受け止めています。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    <text color=\"secondary\" size=\"xs\">チャンク④｜どんな状態に？<\/text>\n    **difficult**\n\n    <text color=\"secondary\" size=\"sm\">ディフィカルト<\/text>\n\n    **意味：** 難しい\n\n    **チャンクのコアイメージ：** 目的達成までに障害があり、簡単には進めない。\n\n    「宿泊施設を探すという行動が、難しい状態になるんです。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    <text color=\"secondary\" size=\"xs\">チャンク⑤｜何をすることが？<\/text>\n    **to find**\n\n    <text color=\"secondary\" size=\"sm\">トゥ・ファインド<\/text>\n\n    **意味：** 見つけること\n\n    **チャンクのコアイメージ：** 必要なものを探し、発見するところまでたどり着く。\n\n    「*find* は探す行為そのものより、見つけるという結果に注目する単語です。」\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    <text color=\"secondary\" size=\"xs\">チャンク⑥｜何を見つける？<\/text>\n    **downtown accommodation**\n\n    <text color=\"secondary\" size=\"sm\">ダウンタウン・アコモデイション<\/text>\n\n    **意味：** 中心街の宿泊施設\n\n    **チャンクのコアイメージ：** 街の中心部にあるホテルなど、泊まるための場所。\n\n    「先輩、*accommodation* は旅行や出張に関する英文でよく登場しますよ。」\n  <\/box>\n<\/box>\n\n### 英語の語順のまま読む練習\n\n<box background=\"surface-secondary\" radius=\"lg\" padding={3} gap={2}>\n  **The city's centennial celebrations**\n\n  市の100周年記念行事が\n\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n\n  **on the weekend of November 17**\n\n  11月17日を含む週末に\n\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n\n  **will make it difficult**\n\n  難しい状態にするだろう\n\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n\n  **to find downtown accommodation.**\n\n  中心街の宿泊施設を見つけることを\n<\/box>\n\n「先輩、*will make it difficult* まで読んだ時点では、何が難しくなるのかを待ってください。次の *to find* が出てきたら、『ああ、見つけることが難しくなるんだ』と意味を完成させるんです。」\n\n## C【重要単語｜読み方とコアイメージ】\n\n<box gap={3}>\n  <box gap={1}>\n    **1. centennial（センテニアル）**\n\n    <text color=\"secondary\" size=\"xs\">/senˈteniəl/<\/text>\n\n    **意味：** 100周年の、100年ごとの\n\n    **コアイメージ：** 100年という大きな時間の節目。\n\n    *The university celebrated its centennial.*\n\n    （大学は創立100周年を祝いました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **2. celebration（セレブレイション）**\n\n    <text color=\"secondary\" size=\"xs\">/ˌseləˈbreɪʃən/<\/text>\n\n    **意味：** 祝賀、記念行事\n\n    **コアイメージ：** 喜ばしい出来事を、多くの人と分かち合う。\n\n    *The celebration attracted many visitors.*\n\n    （その祝賀行事は多くの訪問者を集めました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **3. make（メイク）**\n\n    <text color=\"secondary\" size=\"xs\">/meɪk/<\/text>\n\n    **意味：** 作る、〜な状態にする\n\n    **コアイメージ：** 何かに働きかけて、新しいものや状態を生み出す。\n\n    「今回は物を作るのではなく、難しい状態を生み出すという意味です。」\n\n    *The rain made the roads slippery.*\n\n    （雨で道路が滑りやすくなりました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **4. difficult（ディフィカルト）**\n\n    <text color=\"secondary\" size=\"xs\">/ˈdɪfɪkəlt/<\/text>\n\n    **意味：** 難しい、困難な\n\n    **コアイメージ：** 目的までの道に障害がある。\n\n    *It is difficult to find a job.*\n\n    （仕事を見つけるのは難しいです。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **5. find（ファインド）**\n\n    <text color=\"secondary\" size=\"xs\">/faɪnd/<\/text>\n\n    **意味：** 見つける、発見する\n\n    **コアイメージ：** 探していたもの、あるいは知らなかったものにたどり着く。\n\n    *I found a hotel near the station.*\n\n    （駅の近くにホテルを見つけました。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **6. downtown（ダウンタウン）**\n\n    <text color=\"secondary\" size=\"xs\">/ˌdaʊnˈtaʊn/<\/text>\n\n    **意味：** 中心街、繁華街、都心部\n\n    **コアイメージ：** 商業施設やオフィスが集まる街の中心エリア。\n\n    *The hotel is located downtown.*\n\n    （そのホテルは中心街にあります。）\n  <\/box>\n  <divider color=\"subtle\"/>\n  <box gap={1}>\n    **7. accommodation（アコモデイション）**\n\n    <text color=\"secondary\" size=\"xs\">/əˌkɑːməˈdeɪʃən/<\/text>\n\n    **意味：** 宿泊施設、宿泊設備\n\n    **コアイメージ：** 人が必要とする場所や設備を用意して、滞在できるようにする。\n\n    「イギリス英語では、宿泊施設を指す *accommodation* は通常不可算名詞です。アメリカ英語では *accommodations* という複数形もよく使われます。」\n\n    *We need to book accommodation in advance.*\n\n    （事前に宿泊施設を予約する必要があります。）\n  <\/box>\n<\/box>\n\n## D【文法の核心｜なぜ it が必要なのか】\n\n「先輩、ここは今回一番大事なところです。しっかり理解していきましょう。」\n\n### ① make + 目的語 + 形容詞\n\nまず基本形です。\n\n**make + A + 形容詞**\n\n「Aを〜な状態にする」\n\n*The news made me happy.*\n\n（そのニュースは私を幸せにしました。）\n\n- The news：原因\n- made：〜な状態にした\n- me：影響を受ける人\n- happy：その結果の状態\n\n「では、今回の文では何が難しくなるのでしょう？」\n\nそれは、**to find downtown accommodation（中心街で宿泊施設を見つけること）** です。\n\n### ② 長い目的語を後ろに移す\n\n「本来の目的語が長いと、英語ではそれを後ろに置き、代わりに *it* を使うことがあります。」\n\n<box border radius=\"lg\" padding={3} gap={2}>\n  <text color=\"secondary\" weight=\"medium\" size=\"xs\">今回の構造<\/text>\n  <row align=\"center\" justify=\"between\">\n    <box background=\"surface-secondary\" padding={2} radius=\"md\">\n      **make**\n    <\/box>\n    <box background=\"rgba(20,125,95,0.10)\" padding={2} radius=\"md\">\n      **it**\n    <\/box>\n    <box background=\"surface-secondary\" padding={2} radius=\"md\">\n      **difficult**\n    <\/box>\n  <\/row>\n  <row justify=\"center\"><icon name=\"arrow-down\" color=\"secondary\"/><\/row>\n  <box background=\"surface-secondary\" padding={3} radius=\"md\" gap={1} align=\"center\">\n    **to find downtown accommodation**\n    <text color=\"secondary\" size=\"xs\">it が代わりに受け止めている本当の内容<\/text>\n  <\/box>\n<\/box>\n\n「つまり、*it* は特定の物を指しているわけではありません。後ろの不定詞句を受ける**形式目的語**なんです。」\n\n### ③ It is difficult to ～ との違い\n\n次の2つを比べてください。\n\n**It is difficult to find accommodation.**\n\n宿泊施設を見つけるのは難しい。\n\n**The celebrations will make it difficult to find accommodation.**\n\n記念行事によって、宿泊施設を見つけるのが難しくなる。\n\n「前者は難しいという状態を説明しています。後者は、**記念行事が原因で難しくなる**ことまで表しているんです。」\n\n## E【類義語｜コアイメージとニュアンスの違い】\n\n今回は *difficult* に近い表現を比較しましょう。\n\n| 単語・読み方 | コアイメージ |\n|---|---|\n| **difficult**（ディフィカルト） | 障害があって達成しにくい |\n| **hard**（ハード） | 努力や負担が必要 |\n| **challenging**（チャレンジング） | 能力を試される難しさ |\n| **complicated**（コンプリケイティド） | 多くの要素が絡み合って複雑 |\n| **impossible**（インポッシブル） | 実現できない |\n\n「*difficult* は『難しい』ですが、*impossible* は『不可能』です。記念行事でホテルが探しにくくなるからといって、必ずしも見つからないわけではありませんよ。」\n\n例文も見てください。\n\n- *It is hard to find parking downtown.*（中心街で駐車場を見つけるのは大変です。）\n- *This project is challenging.*（このプロジェクトは難しく、やりがいがあります。）\n- *The booking process is complicated.*（予約手続きは複雑です。）\n\n## 理解確認\n\n{@body const qs=[{q:\"The heavy traffic made ------- difficult to arrive on time.\",opts:[\"it\",\"its\",\"itself\",\"they\"],correct:0,why:\"make it + 形容詞 + to do の形式目的語 it が必要です。\"}, {q:\"The city will hold a ------- celebration.\",opts:[\"century\",\"centennial\",\"center\",\"central\"],correct:1,why:\"centennial は「100周年の」という形容詞で celebration を修飾します。\"}, {q:\"It may be difficult to find ------- downtown.\",opts:[\"accommodation\",\"accommodate\",\"accommodated\",\"accommodating\"],correct:0,why:\"find の目的語には名詞が必要です。accommodation は「宿泊施設」です。\"}]}\n{@body const [answers,setAnswers]=DIL.useState({})}\n{@body const [show,setShow]=DIL.useState(false)}\n<box border radius=\"lg\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>{setAnswers(p=>({...p,[i]:Number(v)}));setShow(false)}}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{String.fromCharCode(65+j)}. {opt}<\/radio>\n        {/each}\n      <\/radio-group>\n      {#if show}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.correct?\"success\":\"default\"} weight=\"medium\">{answers[i]===q.correct?\"正解です！\":`正解：${String.fromCharCode(65+q.correct)}. ${q.opts[q.correct]}`}<\/text>\n          <text size=\"sm\">{q.why}<\/text>\n        <\/box>\n      {/if}\n    <\/box>\n    {#if i<qs.length-1}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n  <button block disabled={Object.keys(answers).length!==3} onClick={()=>setShow(true)}>3問の答え合わせ<\/button>\n  {#if show}\n    <text weight=\"medium\" textAlign=\"center\">{qs.filter((q,i)=>answers[i]===q.correct).length} / 3 問正解<\/text>\n  {/if}\n<\/box>\n\n## 30秒復習\n\n「先輩、最後に今日のポイントを確認しましょう。」\n\n- centennial：100年の節目 → 100周年の\n- celebration：喜びを分かち合う → 祝賀行事\n- make：ある状態を生み出す → 〜にする\n- difficult：障害がある → 難しい\n- find：探していたものにたどり着く → 見つける\n- accommodation：滞在するための設備・場所 → 宿泊施設\n- **make it difficult to do**：〜することを難しくする\n\n**一文で覚える：**\n\n*The festival will make it difficult to find a hotel.*\n\n（その祭りによって、ホテルを見つけるのが難しくなるでしょう。）\n\n「先輩、今回は *it* を『それ』と訳さず、後ろの *to find ...* を受け止める仮の目的語として理解できれば大成功です。次の英文でも、単語だけでなくチャンク全体のコアイメージを意識して読み進めましょう。」\n\n---"}]</script><script>
const cards=JSON.parse(document.getElementById('card-data').textContent);let current=0,tab='ALL',source=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function clean(s){return s.replace(/\{@body[^\n]*\}/g,'').replace(/<\/?(?:box|row|col|grid|grid-item|text|divider|icon|radio-group|radio|button|table|table-row|table-cell|list|list-item|title|caption)[^>]*>/g,'').replace(/\{#(?:each|if)[^}]*\}|\{:else[^}]*\}|\{\/(?:each|if)\}/g,'').replace(/\{[^\n{}]*\?[^\n{}]*\}/g,'').replace(/\n{3,}/g,'\n\n')}
function renderMarkdown(raw){let s=clean(raw),lines=s.split('\n'),out=[],ul=false;for(let line of lines){line=line.trim();if(!line){if(ul){out.push('</ul>');ul=false}continue}if(/^#{1,5} /.test(line)){if(ul){out.push('</ul>');ul=false}let level=line.match(/^#+/)[0].length;out.push('<h'+Math.min(4,level+1)+'>'+inline(line.replace(/^#+\s*/,''))+'</h'+Math.min(4,level+1)+'>')}else if(/^[-*] /.test(line)){if(!ul){out.push('<ul>');ul=true}out.push('<li>'+inline(line.slice(2))+'</li>')}else if(/^> /.test(line)){if(ul){out.push('</ul>');ul=false}out.push('<blockquote>'+inline(line.slice(2))+'</blockquote>')}else if(/^---+$/.test(line)){out.push('<hr>')}else if(/^\|/.test(line)){out.push('<p>'+inline(line)+'</p>')}else out.push('<p>'+inline(line)+'</p>')}if(ul)out.push('</ul>');return out.join('\n')}
function sections(raw){let matches=[...raw.matchAll(/^#{1,3}\s*([A-E])【[^\n]*$/gm)];if(!matches.length)return {intro:raw,groups:{}};let intro=raw.slice(0,matches[0].index),groups={};matches.forEach((m,i)=>groups[m[1]]=raw.slice(m.index,i+1<matches.length?matches[i+1].index:raw.length));return {intro,groups}}
function drawList(){let q=document.getElementById('search').value.trim().toLowerCase();let el=document.getElementById('list');el.innerHTML='';cards.forEach((c,i)=>{if(!(c.n+' '+c.title+' '+c.raw).toLowerCase().includes(q))return;let b=document.createElement('button');b.className='item'+(current===i?' active':'');b.innerHTML='<strong>第'+c.n+'問</strong><small>'+esc(c.title)+'</small>';b.onclick=()=>{current=i;tab='ALL';source=false;draw()};el.append(b)})}
function draw(){let c=cards[current];document.getElementById('count').textContent='第'+c.n+'問 / 全'+cards.length+'問';document.getElementById('title').textContent=c.title;let parts=sections(c.raw),keys=['ALL',...Object.keys(parts.groups)];document.getElementById('tabs').innerHTML='';keys.forEach(k=>{let b=document.createElement('button');b.textContent=k==='ALL'?'全文':k+' 解説';b.className=k===tab?'active':'';b.onclick=()=>{tab=k;source=false;draw()};document.getElementById('tabs').append(b)});let shown=tab==='ALL'?c.raw:parts.intro+'\n\n'+(parts.groups[tab]||'');document.getElementById('body').innerHTML=source?'<pre>'+esc(shown)+'</pre>':renderMarkdown(shown);document.getElementById('showSource').textContent=source?'読みやすく表示':'原文表示';drawList()}
document.getElementById('search').oninput=drawList;document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(cards[current].raw).then(()=>alert('解説全文をコピーしました')).catch(()=>alert('コピーできませんでした。原文表示から選択してください。'))};document.getElementById('showSource').onclick=()=>{source=!source;draw()};draw();
</script></body></html>
